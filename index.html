<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>417 · Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ambient glow */
  .glow {
    position: fixed;
    top: -20%;
    right: -15%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,107,107,.18) 0%, transparent 65%);
    border-radius: 50%;
    pointer-events: none;
    animation: floatGlow 16s ease-in-out infinite;
  }
  .glow2 {
    position: fixed;
    bottom: -25%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255,82,82,.1) 0%, transparent 65%);
    border-radius: 50%;
    pointer-events: none;
    animation: floatGlow 22s ease-in-out infinite reverse;
  }
  @keyframes floatGlow {
    0%,100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(40px) scale(1.05); }
  }

  /* scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,.04) 2px, rgba(0,0,0,.04) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* ── WRAP ── */
  .wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 40px 24px;
  }

  /* ── 417 ── */
  .num {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(100px, 24vw, 260px);
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, #ff6b6b 0%, #ff8787 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    transform: translateY(24px);
    animation: fadeUp .7s .1s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  /* ── SUBTITLE ── */
  .subtitle {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(13px, 2.5vw, 18px);
    font-weight: 400;
    color: rgba(255,255,255,.45);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0;
    animation: fadeUp .6s .5s ease forwards;
  }

  /* ── TYPING BLOCK ── */
  .typing-wrap {
    margin-top: 52px;
    height: 36px;
    display: flex;
    align-items: center;
    opacity: 0;
    animation: fadeIn .4s .9s ease forwards;
  }
  .typing-line {
    font-size: clamp(15px, 3vw, 20px);
    font-weight: 500;
    color: rgba(255,255,255,.8);
    letter-spacing: .3px;
    white-space: nowrap;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.2em;
    background: #ff6b6b;
    margin-left: 3px;
    vertical-align: middle;
    border-radius: 1px;
    animation: blink .7s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

  /* ── BAR ── */
  .bar-wrap {
    margin-top: 48px;
    width: min(420px, 80vw);
    opacity: 0;
    animation: fadeIn .4s 1s ease forwards;
  }
  .bar-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,.3);
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-family: 'Unbounded', sans-serif;
  }
  .bar-track {
    height: 3px;
    background: rgba(255,255,255,.07);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    width: 25%;
    background: linear-gradient(90deg, #ff5252, #ff8787);
    border-radius: 99px;
    position: relative;
    animation: stuckPulse 2.4s ease-in-out infinite;
  }
  .bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.55) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: shineLoop 1.6s ease-in-out infinite;
    border-radius: 99px;
  }
  @keyframes shineLoop {
    0%   { background-position: -100% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes stuckPulse {
    0%,100% { opacity: 1; }
    50%      { opacity: .7; }
  }

  /* ── PERCENT ── */
  #pct {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,.3);
    transition: color .3s;
  }

  /* ── ENTER BUTTON ── */
  .enter-btn {
    margin-top: 56px;
    padding: 14px 44px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
    color: #fff;
    border: none;
    border-radius: 60px;
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(12px) scale(.96);
    box-shadow: 0 16px 48px rgba(255,107,107,.3);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1),
                box-shadow .3s ease,
                opacity .4s ease;
    pointer-events: none;
  }
  .enter-btn.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .enter-btn:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 24px 64px rgba(255,107,107,.45);
  }

  /* ── UTILS ── */
  @keyframes fadeUp {
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn {
    to { opacity:1; }
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="glow2"></div>

<div class="wrap">
  <div class="num">417</div>
  <div class="subtitle">Гистология · РНИМУ</div>

  <div class="typing-wrap">
    <span class="typing-line" id="typingEl"></span><span class="cursor"></span>
  </div>

  <div class="bar-wrap">
    <div class="bar-meta">
      <span>загрузка</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

</div>

<script>
const LINES = [
  'инициализация системы...',
  'загружаем препараты...',
  'монтируем срезы...',
  'подготавливаем теорию...',
  'проверяем гематоксилин...',
  'калибруем микроскоп...',
  'компилируем атлас...',
  'смотрим на корги',
];

const typingEl = document.getElementById('typingEl');
const pctEl    = document.getElementById('pct');

// bar stays at 25% forever
pctEl.textContent = '25%';

let lineIdx = 0;
let charIdx = 0;
let erasing = false;

/* typing engine — loops forever */
function type() {
  const text = LINES[lineIdx];

  if (!erasing) {
    if (charIdx < text.length) {
      typingEl.textContent += text[charIdx++];
      setTimeout(type, charIdx === 1 ? 60 : 36 + Math.random() * 26);
    } else {
      setTimeout(() => { erasing = true; type(); }, 900);
    }
  } else {
    if (charIdx > 0) {
      typingEl.textContent = text.slice(0, --charIdx);
      setTimeout(type, 16 + Math.random() * 14);
    } else {
      erasing = false;
      lineIdx = (lineIdx + 1) % LINES.length;
      setTimeout(type, 140);
    }
  }
}

setTimeout(type, 1100);
</script>
</body>
</html>
