<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>417 |</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            position: relative;
            overflow-x: hidden;
            background: #000;
        }

        /* === ПЛЫВУЩАЯ КАРТИНКА (mount.png) === */
        .nature-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .nature-image {
            width: 110%;
            height: 110%;
            object-fit: cover;
            position: absolute;
            top: -5%;
            left: -5%;
            animation: slowDrift 24s infinite alternate ease-in-out;
            filter: brightness(0.7) contrast(1.1) saturate(1.1);
        }

        @keyframes slowDrift {
            0% {
                transform: scale(1) translate(0%, 0%);
            }
            100% {
                transform: scale(1.08) translate(-3%, -2%);
            }
        }

        /* === МУЗЫКАЛЬНЫЙ ПЛЕЕР (слева сверху) === */
        .music-player {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 8px 18px 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            color: white;
        }

        .track-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .track-artist {
            font-size: 10px;
            opacity: 0.7;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .volume-slider {
            width: 70px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffec80;
            cursor: pointer;
        }

        /* --- КНОПКА КУПИТЬ БИЛЕТЫ --- */
        .buy-ticket-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 15px;
            color: #1a1a1a;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .buy-ticket-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #FFEA00, #FFB347);
        }

        /* Основной контент */
        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер для цифр 417 */
        .number-container {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 30px;
            perspective: 500px;
            flex-wrap: wrap;
            padding: 20px;
            margin-bottom: 60px;
        }

        .digit {
            font-size: 250px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(255, 255, 255, 0.3),
                0 10px 30px rgba(0, 0, 0, 0.5);
            display: inline-block;
            cursor: default;
            animation: bounce 1.2s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .digit-4 { animation-delay: 0s; }
        .digit-1 { animation-delay: 0.2s; }
        .digit-7 { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-80px) scale(1.1); text-shadow: 0 0 40px rgba(255, 255, 255, 0.9); }
            60% { transform: translateY(-40px) scale(1.05); }
        }

        /* Блок с текстом */
        .typing-wrapper {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            padding: 30px 50px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            min-width: 500px;
        }

        .dynamic-text {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 32px;
            background-color: #ffec80;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Футер */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Inter', monospace;
            z-index: 30;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            backdrop-filter: blur(4px);
        }

        .footer a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
        }

        .footer a:hover {
            color: #ffec80;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .digit { font-size: 100px; }
            .number-container { gap: 15px; margin-bottom: 30px; }
            .typing-wrapper { min-width: 90%; padding: 20px; }
            .dynamic-text { font-size: 18px; }
            .cursor { height: 24px; }
            .buy-ticket-btn { top: 15px; right: 15px; padding: 6px 16px; font-size: 12px; }
            .music-player { top: 15px; left: 15px; padding: 6px 14px; gap: 10px; }
            .track-name { font-size: 11px; }
            .control-btn { width: 26px; height: 26px; font-size: 14px; }
            .volume-slider { width: 50px; }
            .footer { font-size: 9px; }
        }
    </style>
</head>
<body>

    <!-- ФОН: ВАША КАРТИНКА mount.png -->
    <div class="nature-background">
        <img class="nature-image" src="mount.png" alt="Горы">
    </div>

    <!-- МУЗЫКАЛЬНЫЙ ПЛЕЕР -->
    <div class="music-player" id="musicPlayer">
        <div class="track-info">
            <span class="track-name">417 Ambient Flow</span>
            <span class="track-artist">Nature & Sound</span>
        </div>
        <div class="player-controls">
            <button class="control-btn" id="playPauseBtn">▶</button>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.4">
        </div>
    </div>

    <!-- КНОПКА КУПИТЬ БИЛЕТЫ -->
    <a href="https://t.me/History_417_bot" target="_blank" class="buy-ticket-btn">
        🎫 Купить билеты
    </a>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content">
        <div class="number-container">
            <span class="digit digit-4">4</span>
            <span class="digit digit-1">1</span>
            <span class="digit digit-7">7</span>
        </div>

        <div class="typing-wrapper">
            <span class="dynamic-text"></span>
            <span class="cursor"></span>
        </div>
    </div>

    <!-- ФУТЕР -->
    <div class="footer">
        <div class="footer-links">
            <a href="mailto:real417@protonmail.com">📧 real417@protonmail.com</a>
            <span style="opacity:0.4;">|</span>
            <a href="https://t.me/RSMU417_bot" target="_blank">📢 @RSMU417_bot</a>
        </div>
        <div>Все права защищены © 2026 — н.в.</div>
    </div>

    <script>
        // ========== АНИМАЦИЯ ТЕКСТА ==========
        const phrases = [
            "417 рандомные цифры",
            "417 powered by Papillon",
            "417 здесь может быть ваша реклама",
            "Were made by артем ий"
        ];
        
        let phraseIndex = 0, charIndex = 0, isDeleting = false;
        let typingSpeed = 100, pauseAfterTyping = 2000;
        const dynamicTextElement = document.querySelector('.dynamic-text');
        
        function typeEffect() {
            const currentPhrase = phrases[phraseIndex];
            if (!isDeleting) {
                dynamicTextElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === currentPhrase.length) {
                    isDeleting = true;
                    typingSpeed = pauseAfterTyping;
                } else {
                    typingSpeed = 100;
                }
            } else {
                dynamicTextElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    typingSpeed = 300;
                } else {
                    typingSpeed = 50;
                }
            }
            setTimeout(typeEffect, typingSpeed);
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeEffect, 500);
        });

        // ========== МУЗЫКАЛЬНЫЙ ПЛЕЕР ==========
        // Если ваш файл называется music.mp3 — замените 'track.mp3' на 'music.mp3'
        // Если другое название — укажите его здесь:
        const audio = new Audio('music.mp3');  // ← ЗДЕСЬ НАЗВАНИЕ ВАШЕГО ФАЙЛА
        
        audio.loop = true;
        audio.volume = 0.4;
        
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        let isPlaying = false;
        
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playPauseBtn.textContent = '▶';
            } else {
                audio.play().catch(e => {
                    console.log('Нажмите Play ещё раз, если музыка не началась');
                    playPauseBtn.textContent = '▶';
                });
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });
        
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });
        
        audio.addEventListener('ended', () => {
            isPlaying = false;
            playPauseBtn.textContent = '▶';
        });
        
        // Чтобы музыка играла даже после ошибки автовоспроизведения
        document.body.addEventListener('click', function initAudio() {
            if (!isPlaying && audio.paused) {
                audio.play().catch(e => {});
                playPauseBtn.textContent = '⏸';
                isPlaying = true;
            }
            document.body.removeEventListener('click', initAudio);
        });
    </script>
</body>
</html>
