        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {

            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(40px); }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 1000px;
            padding: 40px;
        }

        .hero-num {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(80px, 20vw, 280px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8787 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-title {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(32px, 6vw, 72px);
            font-weight: 700;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-out 0.2s backwards;
        }

        .hero-subtitle {
            font-size: clamp(16px, 3vw, 24px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out 0.4s backwards;
        }

        .btn-scroll {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeIn 1s ease-out 0.6s backwards;
            box-shadow: 0 20px 60px rgba(255, 107, 107, 0.3);
        }

        .btn-scroll:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 80px rgba(255, 107, 107, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .grid-section {
            padding: 120px 60px;
            background: #0a0a0a;
        }

        .grid-header {
            max-width: 1400px;
            margin: 0 auto 80px;
        }

        .colloquium-label {
            font-family: 'Unbounded', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #ff6b6b;
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .grid-title {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(36px, 7vw, 84px);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            animation: fadeIn 0.8s ease-out 0.1s backwards;
        }

        .grid-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            max-width: 500px;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .specimens-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
        }

            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 20px;
            padding: 40px;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            animation: cardIn 0.6s ease-out backwards;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .specimen-card:nth-child(1) { animation-delay: 0.1s; }
        .specimen-card:nth-child(2) { animation-delay: 0.15s; }
        .specimen-card:nth-child(3) { animation-delay: 0.2s; }
        .specimen-card:nth-child(4) { animation-delay: 0.25s; }
        .specimen-card:nth-child(n+5) { animation-delay: 0.3s; }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);

            background: rgba(255, 107, 107, 0.08);

            font-size: 48px;

            gap: 8px;

            font-weight: 700;
            color: #ff6b6b;
            letter-spacing: 1px;

        }

        .specimen-name {
            font-family: 'Unbounded', sans-serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        .specimen-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .specimen-btn {
            align-self: flex-start;
            padding: 12px 24px;
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .specimen-btn:hover {
            background: rgba(255, 107, 107, 0.3);
            border-color: rgba(255, 107, 107, 0.6);
            transform: translateX(4px);
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 24px;
            padding: 60px;
            max-width: 800px;

            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            transform: rotate(90deg);
        }

        .modal h2 {
            font-family: 'Unbounded', sans-serif;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #ff6b6b;
        }

        .theory-section {
            margin-bottom: 40px;
        }

        .theory-section h3 {
            font-family: 'Unbounded', sans-serif;
            font-size: 16px;
            font-weight: 700;

            padding: 60px;
            border-top: 1px solid rgba(255, 107, 107, 0.1);
            text-align: center;
            color: rgba(255, 255, 255, 0.5);

        ::-webkit-scrollbar {
            width: 10px;

            background: transparent;
        }

            background: rgba(255, 107, 107, 0.3);

            .specimens-grid { grid-template-columns: 1fr; gap: 24px; }
            .modal-content { padding: 40px 20px; }
            .specimen-card { padding: 24px; }
        }
    </style>
</head>

    function renderSpecimens() {
        const grid = document.getElementById('specimenGrid');
        specimens.forEach((spec, idx) => {
            const card = document.createElement('div');
            card.className = 'specimen-card';
            card.innerHTML = `
                <div class="specimen-emoji">${spec.emoji}</div>
                <div class="specimen-label">№ ${spec.num} • ${spec.stain}</div>
                <h3 class="specimen-name">${spec.name}</h3>
                <p class="specimen-desc">${spec.desc}</p>
                <button class="specimen-btn" onclick="openTheory('${spec.name}', ${JSON.stringify(spec.theory).replace(/'/g, "&apos;")})">
                    Теория →
                </button>
            `;
            grid.appendChild(card);
        });
    }

    function openTheory(title, theory) {
        const modal = document.getElementById('theoryModal');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = `
            <div class="theory-section">
                <h3>Общие сведения</h3>
                <p>${theory.general}</p>
            </div>
            <div class="theory-section">
                <h3>Микроскопическая картина</h3>
                <p>${theory.microscopy}</p>
            </div>
            <div class="theory-section">
                <h3>Функция</h3>
                <p>${theory.function}</p>
            </div>
            <div class="theory-section">
                <h3>Клинико-патологические аспекты</h3>
                <p>${theory.clinical}</p>
            </div>
        `;
        modal.classList.add('active');
    }

    function closeTheory() {
        document.getElementById('theoryModal').classList.remove('active');
    }

    document.getElementById('theoryModal').addEventListener('click', (e) => {
        if (e.target.id === 'theoryModal') closeTheory();
    });

    window.addEventListener('DOMContentLoaded', renderSpecimens);
</script>
