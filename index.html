<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>417 | Динамический текст</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #8B0000 0%, #FF0000 50%, #CC0000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* --- КНОПКА КУПИТЬ БИЛЕТЫ --- */
        .buy-ticket-btn {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 200;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #1a1a1a;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
        }

        .buy-ticket-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #FFEA00, #FFB347);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        /* Контейнер для цифр (417) */
        .number-container {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 30px;
            perspective: 500px;
            flex-wrap: wrap;
            padding: 20px;
            margin-bottom: 60px;
            position: relative;
            z-index: 15;
        }

        /* Стиль для каждой цифры */
        .digit {
            font-size: 250px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(255, 255, 255, 0.3),
                0 10px 30px rgba(0, 0, 0, 0.3);
            display: inline-block;
            cursor: default;
            transition: transform 0.2s ease;
            animation: bounce 1.2s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .digit-4 { animation-delay: 0s; }
        .digit-1 { animation-delay: 0.2s; }
        .digit-7 { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            30% {
                transform: translateY(-80px) scale(1.1);
                text-shadow: 0 0 40px rgba(255, 255, 255, 0.9);
            }
            60% {
                transform: translateY(-40px) scale(1.05);
            }
        }

        /* Блок для набирающегося текста */
        .typing-wrapper {
            position: relative;
            z-index: 15;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 30px 50px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 20px;
            min-width: 500px;
        }

        .dynamic-text {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 32px;
            background-color: #ffec80;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Футер */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Inter', monospace;
            letter-spacing: 0.5px;
            z-index: 30;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.2s ease;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.4);
        }

        .footer a:hover {
            color: #ffec80;
            border-bottom-color: #ffec80;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .footer-separator {
            color: rgba(255, 255, 255, 0.3);
        }

        /* === ПАДАЮЩИЕ ЗЕЛЕНЫЕ ЦИФРЫ ПО КРАЯМ === */
        .matrix-left, .matrix-right {
            position: fixed;
            top: 0;
            width: 90px;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .matrix-left { left: 10px; }
        .matrix-right { right: 10px; }

        .digit-fall {
            position: absolute;
            color: #0f0;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 4px #0f0, 0 0 2px #0a0;
            white-space: nowrap;
            animation: fallGlitch linear infinite;
            opacity: 0;
        }

        @keyframes fallGlitch {
            0% {
                transform: translateY(-20vh) translateX(0);
                opacity: 0.9;
                text-shadow: 0 0 2px #0f0;
            }
            10% {
                opacity: 1;
                text-shadow: -1px 0 red, 1px 0 blue, 0 0 5px #0f0;
            }
            80% {
                opacity: 0.8;
                text-shadow: 1px -1px cyan, -1px 1px magenta;
            }
            100% {
                transform: translateY(110vh) translateX(calc(6px * var(--glitch-shift, 1)));
                opacity: 0;
                filter: blur(1px);
            }
        }

        /* Адаптация под телефон */
        @media (max-width: 768px) {
            .digit { font-size: 100px; }
            .number-container { gap: 15px; margin-bottom: 30px; }
            .typing-wrapper { min-width: 90%; padding: 20px; }
            .dynamic-text { font-size: 18px; }
            .cursor { height: 24px; }
            .buy-ticket-btn {
                top: 15px;
                right: 15px;
                padding: 8px 20px;
                font-size: 14px;
            }
            .footer { font-size: 9px; bottom: 12px; }
            .footer-links { gap: 12px; }
            .matrix-left, .matrix-right { width: 45px; }
            .digit-fall { font-size: 18px; }
        }

        @media (max-width: 480px) {
            .matrix-left, .matrix-right { width: 30px; }
            .digit-fall { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- ПАДАЮЩИЕ ЗЕЛЕНЫЕ ЦИФРЫ СЛЕВА И СПРАВА -->
    <div class="matrix-left" id="matrixLeft"></div>
    <div class="matrix-right" id="matrixRight"></div>

    <!-- КНОПКА КУПИТЬ БИЛЕТЫ -->
    <a href="https://t.me/History_417_bot" target="_blank" class="buy-ticket-btn">
        🎫 Купить билеты
    </a>

    <!-- ОСНОВНОЙ КОНТЕНТ (как в старых версиях) -->
    <div style="position: relative; text-align: center; z-index: 20;">
        <div class="number-container">
            <span class="digit digit-4">4</span>
            <span class="digit digit-1">1</span>
            <span class="digit digit-7">7</span>
        </div>

        <div class="typing-wrapper">
            <span class="dynamic-text"></span>
            <span class="cursor"></span>
        </div>
    </div>

    <!-- ФУТЕР -->
    <div class="footer">
        <div class="footer-links">
            <a href="mailto:real417@protonmail.com">📧 real417@protonmail.com</a>
            <span class="footer-separator">|</span>
            <a href="https://t.me/RSMU417_bot" target="_blank">📢 @RSMU417_bot</a>
        </div>
        <div>Все права защищены © 2026 — н.в.</div>
    </div>

    <script>
        // ========== АНИМАЦИЯ ТЕКСТА (печать/стирание) ==========
        const phrases = [
            "417 мы знаем философию",
            "417 продать историю",
            "417 купить без смс из регистрации",
            "417 рниму.нет не наш домен"
        ];
        
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typingSpeed = 100;
        let pauseAfterTyping = 2000;
        
        const dynamicTextElement = document.querySelector('.dynamic-text');
        
        function typeEffect() {
            const currentPhrase = phrases[phraseIndex];
            
            if (!isDeleting) {
                dynamicTextElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
                
                if (charIndex === currentPhrase.length) {
                    isDeleting = true;
                    typingSpeed = pauseAfterTyping;
                } else {
                    typingSpeed = 100;
                }
            } else {
                dynamicTextElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                
                if (charIndex === 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    typingSpeed = 300;
                } else {
                    typingSpeed = 50;
                }
            }
            
            setTimeout(typeEffect, typingSpeed);
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeEffect, 500);
        });

        // ========== ПАДАЮЩИЕ ЦИФРЫ 4,1,7 ПО КРАЯМ (ЗЕЛЕНЫЕ С ГЛИТЧЕМ) ==========
        const digits = ['4', '1', '7'];
        
        function createFallingDigit(container) {
            const digitSpan = document.createElement('div');
            digitSpan.className = 'digit-fall';
            
            // Случайная цифра из 4,1,7
            const randomDigit = digits[Math.floor(Math.random() * digits.length)];
            digitSpan.textContent = randomDigit;
            
            // Случайная длительность падения (от 4 до 11 секунд)
            const duration = 4 + Math.random() * 7;
            digitSpan.style.animationDuration = `${duration}s`;
            
            // Случайная задержка старта (от -15 до 0 секунд, чтобы не все сразу падали)
            const startDelay = Math.random() * -15;
            digitSpan.style.animationDelay = `${startDelay}s`;
            
            // Случайное начальное положение по вертикали
            const topPos = Math.random() * 100;
            digitSpan.style.top = `${topPos}%`;
            
            // Небольшой горизонтальный сдвиг в пределах своей колонки
            const offsetX = (Math.random() - 0.5) * 16;
            digitSpan.style.setProperty('--glitch-shift', (offsetX / 8).toFixed(1));
            digitSpan.style.transform = `translateX(${offsetX}px)`;
            
            // Размер шрифта с разбросом (18-38px)
            const fontSize = 18 + Math.random() * 20;
            digitSpan.style.fontSize = `${fontSize}px`;
            
            // Рандомная прозрачность
            digitSpan.style.opacity = 0.5 + Math.random() * 0.5;
            
            container.appendChild(digitSpan);
            
            // Удаляем после окончания анимации
            digitSpan.addEventListener('animationend', () => {
                digitSpan.remove();
            });
        }
        
        function startMatrixRain(container, intervalMs) {
            setInterval(() => {
                // Создаём 2-4 цифры за раз для плотного дождя
                const count = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < count; i++) {
                    createFallingDigit(container);
                }
            }, intervalMs);
        }
        
        const leftMatrix = document.getElementById('matrixLeft');
        const rightMatrix = document.getElementById('matrixRight');
        
        // Запускаем дождь слева и справа с разной интенсивностью
        startMatrixRain(leftMatrix, 550);
        startMatrixRain(rightMatrix, 600);
    </script>
</body>
</html>
