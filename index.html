<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>417 | Гистология — 6 коллоквиум</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            position: relative;
            overflow-x: hidden;
            background: #000;
        }

        .nature-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .nature-image {
            width: 110%;
            height: 110%;
            object-fit: cover;
            position: absolute;
            top: -5%;
            left: -5%;
            animation: slowDrift 24s infinite alternate ease-in-out;
            filter: brightness(0.7) contrast(1.1) saturate(1.1);
        }

        @keyframes slowDrift {
            0% { transform: scale(1) translate(0%, 0%); }
            100% { transform: scale(1.08) translate(-3%, -2%); }
        }

        .music-player {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 8px 18px 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            color: white;
        }

        .track-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .track-artist {
            font-size: 10px;
            opacity: 0.7;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .volume-slider {
            width: 70px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffec80;
            cursor: pointer;
        }

        .main-nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 8px 24px;
            display: flex;
            gap: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .main-nav button {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            transition: all 0.3s;
        }
        .main-nav button.active { color: #ffec80; border-bottom: 2px solid #ffec80; }

        .buy-ticket-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 15px;
            color: #1a1a1a;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.5px;
        }
        .buy-ticket-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #FFEA00, #FFB347);
        }

        .page {
            display: none;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding: 100px 20px 80px;
        }
        .page.active { display: block; }

        /* ГЛАВНАЯ СТРАНИЦА */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .number-container {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 30px;
            perspective: 500px;
            flex-wrap: wrap;
            padding: 20px;
            margin-bottom: 60px;
        }
        .digit {
            font-size: 250px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 0 40px rgba(255,255,255,0.3), 0 10px 30px rgba(0,0,0,0.5);
            display: inline-block;
            cursor: default;
            animation: bounce 1.2s ease-in-out infinite;
            transform-origin: center bottom;
        }
        .digit-4 { animation-delay: 0s; }
        .digit-1 { animation-delay: 0.2s; }
        .digit-7 { animation-delay: 0.4s; }
        @keyframes bounce {
            0%,100%{ transform: translateY(0) scale(1); }
            30%{ transform: translateY(-80px) scale(1.1); text-shadow: 0 0 40px rgba(255,255,255,0.9); }
            60%{ transform: translateY(-40px) scale(1.05); }
        }

        .typing-wrapper {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            padding: 30px 50px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            min-width: 500px;
        }
        .dynamic-text {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .cursor {
            display: inline-block;
            width: 3px;
            height: 32px;
            background-color: #ffec80;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%,100%{ opacity: 1; }
            50%{ opacity: 0; }
        }

        /* СТИЛИ ГИСТОЛОГИИ */
        .hist-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .hist-header h1 {
            font-size: 2.4rem;
            color: #ffec80;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .colloquium-badge {
            background: rgba(255,236,128,0.15);
            backdrop-filter: blur(8px);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 100px;
            margin-top: 12px;
            font-weight: 500;
            border: 1px solid #ffec80;
            color: #ffec80;
        }
        .specimen-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 28px;
        }
        .specimen-card {
            background: rgba(18, 22, 40, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
        }
        .specimen-card:hover {
            transform: translateY(-5px);
            border-color: #ffec80;
        }
        .image-area {
            position: relative;
            background: #03050a;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,215,0,0.3);
        }
        .prep-img {
            width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: cover;
            display: block;
        }
        .badge-number {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            font-family: monospace;
            color: #ffec80;
            border: 1px solid rgba(255,215,0,0.6);
            z-index: 5;
        }
        .badge-stain {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            font-family: monospace;
            color: #ffdd99;
            border: 1px solid rgba(255,215,0,0.6);
            z-index: 5;
        }
        .card-info {
            padding: 18px 16px 20px;
        }
        .prep-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            margin-bottom: 6px;
        }
        .prep-desc {
            font-size: 0.75rem;
            color: #b4c0da;
            margin-bottom: 14px;
        }
        .action-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .toggle-labels {
            background: rgba(255,215,0,0.2);
            border: 1px solid #ffec80;
            color: #ffec80;
            padding: 7px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-labels:hover {
            background: #ffec80;
            color: #111;
        }
        .theory-mini-btn {
            background: #2c3a5e;
            border: none;
            color: white;
            padding: 7px 18px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .theory-mini-btn:hover {
            background: #1f2a46;
        }
        .click-hint {
            font-size: 10px;
            color: #9aa3bf;
            text-align: right;
            margin-top: 12px;
        }

        /* Мини-теория */
        .theory-modal {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 360px;
            background: rgba(10, 12, 22, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid #ffec80;
            z-index: 300;
            display: none;
            flex-direction: column;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
        }
        .theory-modal.active {
            display: flex;
        }
        .theory-header {
            padding: 14px 18px;
            background: rgba(0,0,0,0.6);
            border-bottom: 1px solid #ffec80;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 28px 28px 0 0;
            color: #ffec80;
            font-weight: 700;
        }
        .theory-header button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }
        .theory-body {
            padding: 20px;
            color: #eef2ff;
            font-size: 14px;
            line-height: 1.5;
            max-height: 320px;
            overflow-y: auto;
        }

        /* Лайтбокс для фото */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(16px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 24px;
            border: 2px solid rgba(255,215,0,0.6);
        }
        .lightbox-caption {
            margin-top: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 24px;
            border-radius: 40px;
            color: #ffec80;
        }
        .close-lightbox {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Inter', monospace;
            z-index: 30;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            backdrop-filter: blur(4px);
        }
        .footer a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
        }
        .footer a:hover { color: #ffec80; }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .digit { font-size: 100px; }
            .number-container { gap: 15px; margin-bottom: 30px; }
            .typing-wrapper { min-width: 90%; padding: 20px; }
            .dynamic-text { font-size: 18px; }
            .cursor { height: 24px; }
            .buy-ticket-btn { top: 15px; right: 15px; padding: 6px 16px; font-size: 12px; }
            .music-player { top: 15px; left: 15px; padding: 6px 14px; gap: 10px; }
            .track-name { font-size: 11px; }
            .control-btn { width: 26px; height: 26px; font-size: 14px; }
            .volume-slider { width: 50px; }
            .footer { font-size: 9px; }
            .main-nav { top: 70px; gap: 15px; padding: 6px 16px; }
            .main-nav button { font-size: 12px; }
            .specimen-grid { grid-template-columns: 1fr; padding: 0 12px; }
            .theory-modal { width: 90%; right: 5%; bottom: 20px; }
        }
    </style>
</head>

    <script>
        // ========== АНИМАЦИЯ ТЕКСТА ==========
        const phrases = [
            "САЙТ НА ТЕХ РАБОТАХ",
            "САЙТ НА ТЕХ РАБОТАХ",
            "САЙТ НА ТЕХ РАБОТАХ",
            "САЙТ НА ТЕХ РАБОТАХ"
        ];
        let phraseIndex = 0, charIndex = 0, isDeleting = false, typingSpeed = 100, pauseAfterTyping = 2000;
        const dynamicTextElement = document.querySelector('.dynamic-text');
        function typeEffect() {
            if (!dynamicTextElement) return;
            const currentPhrase = phrases[phraseIndex];
            if (!isDeleting) {
                dynamicTextElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === currentPhrase.length) { isDeleting = true; typingSpeed = pauseAfterTyping; }
                else { typingSpeed = 100; }
            } else {
                dynamicTextElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) { isDeleting = false; phraseIndex = (phraseIndex + 1) % phrases.length; typingSpeed = 300; }
                else { typingSpeed = 50; }
            }
            setTimeout(typeEffect, typingSpeed);
        }
        
        // ========== МУЗЫКА ==========
        const audio = new Audio('music.mp3');
        audio.loop = true;
        audio.volume = 0.4;
        let isPlaying = false;
        document.getElementById('playPauseBtn').onclick = () => {
            if (isPlaying) { audio.pause(); document.getElementById('playPauseBtn').textContent = '▶'; }
            else { audio.play(); document.getElementById('playPauseBtn').textContent = '⏸'; }
            isPlaying = !isPlaying;
        };
        document.getElementById('volumeSlider').oninput = (e) => audio.volume = e.target.value;
        document.body.addEventListener('click', function initAudio() {
            if (!isPlaying && audio.paused) { audio.play().catch(e=>{}); document.getElementById('playPauseBtn').textContent = '⏸'; isPlaying = true; }
            document.body.removeEventListener('click', initAudio);
        });
        
        // ========== БАЗА ПРЕПАРАТОВ (все из списка) ==========
        // СИСТЕМА ИМЕНОВАНИЯ ФАЙЛОВ:
        // - Чистое фото (без подписей): номерC.png  (например "120C.png")
        // - Фото с подписями: номер.png        (например "120.png")
        // Для номеров с буквой (129a) используйте "129aC.png" и "129a.png"
        
        const specimens = [
            { id: 1, name: "Нитевидные сосочки языка", stain: "Г-Э", number: "120", description: "Кератинизированные нитевидные выросты, придают шероховатость языку.", theory: "Нитевидные сосочки — самые многочисленные, покрыты многослойным плоским ороговевающим эпителием. Выполняют механическую функцию.", imgClean: "120C.png", imgLabeled: "120.png" },
            { id: 2, name: "Листовидные сосочки", stain: "Г-Э", number: "121", description: "Содержат вкусовые луковицы, расположены по бокам языка.", theory: "Листовидные сосочки хорошо развиты у детей, участвуют в восприятии вкуса. Вкусовые почки заложены в эпителии.", imgClean: "121C.png", imgLabeled: "121.png" },
            { id: 3, name: "Развитие зуба (эмалевый орган)", stain: "Г-Э", number: "122", description: "Эмалевый орган, звездчатый ретикулум, зубной сосочек.", theory: "Эмалевый орган — производное эктодермы. Внутренние клетки дифференцируются в амелобласты, формирующие эмаль.", imgClean: "122C.png", imgLabeled: "122.png" },
            { id: 4, name: "Развитие зуба (дентин и эмаль)", stain: "Г-Э", number: "123", description: "Одонтобласты, эмалевые призмы, стадия обызвествления.", theory: "Дентин вырабатывается одонтобластами, эмаль — амелобластами. На этой стадии видна матрица дентина и эмали.", imgClean: "123C.png", imgLabeled: "123.png" },
            { id: 5, name: "Поперечный разрез пищевода собаки", stain: "Г-Э", number: "126", description: "Многослойный плоский эпителий, мышечная оболочка.", theory: "Пищевод выстлан многослойным плоским неороговевающим эпителием. Собственная пластинка содержит кардиальные железы.", imgClean: "126C.png", imgLabeled: "126.png" },

            { id: 10, name: "Двенадцатиперстная кишка", stain: "Г-Э", number: "130", description: "Высокие ворсинки, крипты, бокаловидные клетки.", theory: "Двенадцатиперстная кишка: ворсинки высокие, в подслизистой основе — сложные трубчатые железы (Бруннера).", imgClean: "130C.png", imgLabeled: "130.png" },
            { id: 11, name: "Тонкая кишка щенка", stain: "Г-Э", number: "131", description: "Высокие ворсинки, активный рост, лимфоидные фолликулы.", theory: "Щенячья тонкая кишка: хорошо развиты ворсинки и крипты, активное пищеварение. Лимфоидные узелки в стадии формирования.", imgClean: "131C.png", imgLabeled: "131.png" },
            { id: 12, name: "Толстая кишка собаки", stain: "Г-Э", number: "132", description: "Крипты, много бокаловидных клеток, отсутствие ворсинок.", theory: "Толстая кишка: отсутствуют ворсинки, много бокаловидных клеток, крипты глубокие. Мышечный слой хорошо развит.", imgClean: "132C.png", imgLabeled: "132.png" },
            { id: 13, name: "Аппендикс", stain: "Г-Э", number: "133", description: "Лимфоидная ткань, узкий просвет, складки слизистой.", theory: "Червеобразный отросток: диффузная лимфоидная ткань и лимфоидные узелки. В просвете могут быть остатки содержимого.", imgClean: "133C.png", imgLabeled: "133.png" },
            { id: 14, name: "Околоушная железа собаки", stain: "Г-Э", number: "135", description: "Серозные ацинусы, жировые клетки.", theory: "Серозный тип секреции, богата ферментами. Протоки выстланы кубическим эпителием, видны вставочные протоки.", imgClean: "135C.png", imgLabeled: "135.png" },
            { id: 15, name: "Подчелюстная железа человека", stain: "Г-Э", number: "136", description: "Смешанные концевые отделы (серозно-слизистые).", theory: "Серозно-слизистая железа. Серозные полулуния Нуну — характерный признак. Протоки выстланы кубическим эпителием.", imgClean: "136C.png", imgLabeled: "136.png" },
            { id: 16, name: "Поджелудочная железа собаки", stain: "Г-Э", number: "137", description: "Ацинусы, островки Лангерганса, выводные протоки.", theory: "Экзокринная часть — ацинусы; эндокринная — островки (инсулин, глюкагон). Протоки выстланы кубическим эпителием.", imgClean: "137C.png", imgLabeled: "137.png" },
            { id: 17, name: "Печень свиньи", stain: "Пирофуксин-железный гематоксилин", number: "138", description: "Печеночные дольки, центральная вена, портальные тракты.", theory: "Печень: дольковое строение, центральная вена, балки гепатоцитов. Пирофуксин окрашивает соединительную ткань.", imgClean: "138C.png", imgLabeled: "138.png" },
            { id: 18, name: "Печень человека", stain: "Г-Э", number: "139", description: "Гепатоциты, портальные тракты, синусоиды.", theory: "Классическая долька. Портальные тракты содержат междольковые артерию, вену и желчный проток.", imgClean: "139C.png", imgLabeled: "139.png" },
            { id: 19, name: "Желчный пузырь", stain: "Г-Э", number: "140", description: "Складчатая слизистая, эпителий, гладкие миоциты.", theory: "Эпителий высокий призматический, всасывает воду, концентрирует желчь. Мышечная оболочка развита слабо.", imgClean: "140C.png", imgLabeled: "140.png" },
            { id: 20, name: "Трахея собаки", stain: "Г-Э", number: "141", description: "Реснитчатый эпителий, гиалиновый хрящ, железы.", theory: "Слизистая оболочка с мерцательным эпителием, подслизистая содержит смешанные железы, адвентиция с гиалиновыми кольцами.", imgClean: "141C.png", imgLabeled: "141.png" },
            { id: 21, name: "Легкое кошки", stain: "Г-Э", number: "142", description: "Альвеолы, пневмоциты, мелкие бронхи.", theory: "Респираторный отдел: альвеолы с пневмоцитами I и II типов, сурфактант. Бронхиолы выстланы кубическим эпителием.", imgClean: "142C.png", imgLabeled: "142.png" },
            { id: 22, name: "Кожа пальца человека", stain: "Г-Э", number: "143", description: "Эпидермис, дерма, потовые железы.", theory: "Многослойный плоский ороговевающий эпителий (эпидермис), сосочковый и сетчатый слои дермы, потовые железы.", imgClean: "143C.png", imgLabeled: "143.png" },
            { id: 23, name: "Кожа с волосом человека (продольный разрез)", stain: "Г-Э", number: "144", description: "Волосяной фолликул, сальные железы, мышца.", theory: "Волос: луковица, корень, сальные железы, мышца-подниматель волоса. Видно продольное сечение волосяного фолликула.", imgClean: "144C.png", imgLabeled: "144.png" }
        ];
        
        // Состояние: по умолчанию показываем ЧИСТЫЕ фото (без подписей) — false
        let showLabelsMode = {};
        specimens.forEach(s => { showLabelsMode[s.id] = false; });  // false = чистое фото (без подписей)
        
        // Функция получения пути к папке с фото
        function getImagePath(prep, useLabeled) {
           const baseFolder = "";   // теперь ищет фото в корне
            if (useLabeled) {
                return baseFolder + prep.imgLabeled;
            } else {
                return baseFolder + prep.imgClean;
            }
        }
        
        // Рендер гистологии
        const gridContainer = document.getElementById('specimenGrid');
        
        function renderHistology() {
            if (!gridContainer) return;
            gridContainer.innerHTML = '';
            
            specimens.forEach(prep => {
                const useLabeled = showLabelsMode[prep.id] === true;
                const currentImg = getImagePath(prep, useLabeled);
                const buttonText = useLabeled ? '🔍 Убрать подписи' : '🏷️ Показать подписи';
                const modeText = useLabeled ? 'c подписями' : 'без подписей';
                
                const card = document.createElement('div');
                card.className = 'specimen-card';
                
                const imageArea = document.createElement('div');
                imageArea.className = 'image-area';
                imageArea.style.cursor = 'pointer';
                imageArea.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightbox(currentImg, `${prep.name} | №${prep.number} | ${prep.stain} | ${modeText}`);
                });
                
                const img = document.createElement('img');
                img.src = currentImg;
                img.alt = prep.name;
                img.className = 'prep-img';
                img.onerror = () => { 
                    img.src = 'https://placehold.co/600x400/1a1f2e/ffec80?text=Загрузите+фото+'+prep.number;
                };
                
                const badgeNumber = document.createElement('div');
                badgeNumber.className = 'badge-number';
                badgeNumber.innerText = `№ ${prep.number}`;
                
                const badgeStain = document.createElement('div');
                badgeStain.className = 'badge-stain';
                badgeStain.innerText = `🎨 ${prep.stain}`;
                
                imageArea.appendChild(img);
                imageArea.appendChild(badgeNumber);
                imageArea.appendChild(badgeStain);
                
                const infoDiv = document.createElement('div');
                infoDiv.className = 'card-info';
                infoDiv.innerHTML = `
                    <div class="prep-title">${prep.name}</div>
                    <div class="prep-desc">${prep.description}</div>
                    <div class="action-buttons">
                        <button class="toggle-labels" data-id="${prep.id}">${buttonText}</button>
                        <button class="theory-mini-btn" data-id="${prep.id}" data-name="${prep.name.replace(/"/g, '&quot;')}" data-theory="${prep.theory.replace(/"/g, '&quot;')}">📖 Теория</button>
                    </div>
                    <div class="click-hint">🖱️ Нажмите на фото для увеличения</div>
                `;
                card.appendChild(imageArea);
                card.appendChild(infoDiv);
                gridContainer.appendChild(card);
            });
            
            // Обработчики кнопок переключения подписей
            document.querySelectorAll('.toggle-labels').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.getAttribute('data-id'));
                    showLabelsMode[id] = !showLabelsMode[id];
                    renderHistology();  // Перерисовываем с новыми фото
                });
            });
            
            // Обработчики кнопок теории
            document.querySelectorAll('.theory-mini-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const theoryText = btn.getAttribute('data-theory');
                    const name = btn.getAttribute('data-name');
                    const theoryContainer = document.getElementById('theoryContent');
                    theoryContainer.innerHTML = `<strong>${name}</strong><br><br>${theoryText}`;
                    document.getElementById('theoryModalWindow').classList.add('active');
                });
            });
        }
        
        // Лайтбокс для увеличения фото
        const lightboxEl = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImage');
        const lightboxCaptionSpan = document.getElementById('lightboxCaptionText');
        
        function openLightbox(imgSrc, caption) {
            lightboxImg.src = imgSrc;
            lightboxCaptionSpan.innerText = caption;
            lightboxEl.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeLightbox() {
            lightboxEl.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        document.getElementById('closeLightboxBtn').addEventListener('click', closeLightbox);
        lightboxEl.addEventListener('click', (e) => { if(e.target === lightboxEl) closeLightbox(); });
        
        // Закрытие теории
        document.getElementById('closeTheoryBtn').addEventListener('click', () => {
            document.getElementById('theoryModalWindow').classList.remove('active');
        });
        
        // Навигация между страницами
        const homePage = document.getElementById('homePage');
        const histPage = document.getElementById('histologyPage');
        const navHome = document.getElementById('navHome');
        const navHistology = document.getElementById('navHistology');
        
        function showPage(page) {
            homePage.classList.remove('active');
            histPage.classList.remove('active');
            if (page === 'home') {
                homePage.classList.add('active');
                navHome.classList.add('active');
                navHistology.classList.remove('active');
            } else {
                histPage.classList.add('active');
                navHistology.classList.add('active');
                navHome.classList.remove('active');
                if (gridContainer.children.length === 0) renderHistology();
            }
        }
        
        navHome.addEventListener('click', () => showPage('home'));
        navHistology.addEventListener('click', () => showPage('hist'));
        
        // Запуск
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeEffect, 500);
            renderHistology();
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (lightboxEl.classList.contains('active')) closeLightbox();
                    if (document.getElementById('theoryModalWindow').classList.contains('active')) 
                        document.getElementById('theoryModalWindow').classList.remove('active');
                }
            });
        });
    </script>
</body>
